[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-repro"
version = "0.1.0"
description = "Turn AI-agent failures into safe, redacted, replayable GitHub issues."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Manus AI" }]
license = { file = "LICENSE" }
keywords = ["ai-agents", "llm", "debugging", "reproducibility", "observability", "testing", "redaction"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
agent-repro = "agent_repro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_repro"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
